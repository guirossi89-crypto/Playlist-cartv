name: Verificar e otimizar playlist IPTV

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: playlist-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: python -m pip install --disable-pip-version-check requests
      - name: Verificar fontes e gerar playlist otimizada
        run: |
          python scripts/optimize_playlist.py --input "playlist-edited (1).m3u" --output "playlist-otimizada.m3u" --timeout 12
      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist-otimizada.m3u
          if git diff --cached --quiet; then
            echo "Sem mudanças na playlist otimizada."
          else
            git commit -m "Atualiza playlist otimizada automaticamente"
            git push
          fi
